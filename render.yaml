# Déploiement de l'API Django sur Render.
#
# Render lit ce fichier et crée le service tout seul. Les variables marquées
# `sync: false` ne sont PAS écrites ici : Render les demande une par une dans
# son interface, et elles n'apparaissent jamais dans le code — c'est ce qui
# évite qu'un mot de passe finisse sur GitHub.
#
# Le site (React) n'est pas ici : il va sur Cloudflare, voir frontend/.

services:
  - type: web
    name: montror-api
    runtime: python
    plan: free
    region: frankfurt # le plus proche d'Abidjan chez Render
    rootDir: backend
    buildCommand: "./build.sh"
    # 2 workers : l'offre gratuite plafonne à 512 Mo de mémoire, au-delà le
    # service redémarre en boucle.
    startCommand: "gunicorn config.wsgi:application --workers 2 --timeout 60"
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DEBUG
        value: "False"
      # Générée par Render, jamais choisie à la main : c'est elle qui signe
      # les sessions et les jetons.
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      # --- à renseigner dans l'interface Render ---
      - key: DATABASE_URL # Neon : chaîne de connexion Postgres
        sync: false
      - key: CLOUDINARY_URL # Cloudinary : « API Environment variable »
        sync: false
      - key: ALLOWED_HOSTS # ex. montror-api.onrender.com
        sync: false
      - key: CORS_ALLOWED_ORIGINS # ex. https://montror.pages.dev
        sync: false
      - key: CSRF_TRUSTED_ORIGINS # même valeur que ci-dessus
        sync: false
      # --- e-mail (mot de passe oublié) ---
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "1"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD # mot de passe d'application Google
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: NOM_BOUTIQUE
        value: MONTR'OR
      # Rappelé dans les alertes de commande, pour ouvrir l'admin d'un
      # clic depuis son téléphone au lieu de chercher l'adresse.
      - key: URL_ADMIN
        value: https://montror-api.onrender.com/admin/
